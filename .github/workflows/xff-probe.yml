name: XFF probe

# TEMPORARY, and meant to be deleted once the question it answers is
# answered. Installs a diagnostic function that reports the *shape* of the
# x-forwarded-for header Supabase gives the database — how many
# comma-separated elements, and whether each is a private range — so we can
# decide whether the per-IP rate limit in report_machine() should key on one
# element instead of the whole string.
#
# It deliberately never returns an address. Only element count, family,
# private-or-not, string length, and the NAMES of the headers PostgREST can
# see. Verified against local Postgres + PostgREST containers on five header
# shapes before ever being pointed at the live project.
#
# Run with action=install, call the RPC once, then run with action=remove.
# Do not leave it installed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Install or remove the probe
        required: true
        default: remove
        type: choice
        options: [install, remove]

jobs:
  probe:
    name: XFF probe
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install probe
        if: ${{ inputs.action == 'install' }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f tools/xff_probe.sql

      - name: Remove probe
        if: ${{ inputs.action == 'remove' }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "drop function if exists public.xff_probe();" \
            -c "notify pgrst, 'reload schema';"

      # Whichever branch ran, say out loud whether the function is present,
      # so a failed removal can't pass unnoticed.
      - name: Report state
        run: |
          present=$(psql "$SUPABASE_DB_URL" -t -A -c "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname = 'xff_probe'")
          echo "xff_probe installed: $present (0 = gone, 1 = live)" >> "$GITHUB_STEP_SUMMARY"
          echo "xff_probe installed: $present"
          if [ "${{ inputs.action }}" = "remove" ] && [ "$present" != "0" ]; then
            echo "FAIL: probe is still installed after a remove run."
            exit 1
          fi
