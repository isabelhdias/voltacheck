name: Fix machine rows

# TEMPORARY, and deleted once run. Applies tools/fix_machine_rows.sql — a
# short, reviewable list of one-off corrections to specific rows, each named
# by uuid — to the live database.
#
# This exists so Isabel does not have to edit rows by hand in the Supabase
# Table Editor on a phone, which is where the mistakes in this project have
# actually happened. workflow_dispatch means only someone with write access
# to the repo can start it.
on:
  workflow_dispatch:

jobs:
  fix:
    name: Fix machine rows
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      # One transaction: if any statement fails, none of them applied.
      - name: Apply corrections
        run: |
          psql "$SUPABASE_DB_URL" --single-transaction -v ON_ERROR_STOP=1 \
            -f tools/fix_machine_rows.sql | tee "$RUNNER_TEMP/out.txt"
          {
            echo '## Result'
            echo '```'
            cat "$RUNNER_TEMP/out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
