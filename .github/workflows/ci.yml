name: CI

on:
  push:
    branches: [main]
  # Pull requests too. Without this a PR gets no CI at all, and since
  # Isabel can't run anything locally, reviewing one would mean taking the
  # tests on faith — which is the opposite of why this workflow exists.
  # Safe to run on PRs: no step here touches a secret. The containers the
  # integration layer needs are built on the runner.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fastest-first: unit tests catch domain-rule regressions (the 18h
      # decay, town search, chain filtering) in ~100ms. No reason to wait a
      # minute for a browser to tell you what this already caught.
      - name: Unit tests (domain logic)
        run: npm run test:unit

      # Real Postgres + PostgREST containers, built by the suite itself —
      # Docker is preinstalled on this runner, so no services: block and no
      # secrets. Exercises paging, RLS and report_machine() the way e2e
      # deliberately never does (e2e stubs supabase-js and stays in local
      # mode). ~6s.
      - name: Integration tests (Postgres + PostgREST)
        run: npm run test:integration

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache only restores the browser binaries, not the OS libraries
      # `--with-deps` also installs. Cheap to redo every run.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # e2e runs entirely in local mode (supabase-js stubbed, see
      # test/e2e/fixtures.js) — it can never reach the production database.
      # HTML report + traces on failure are the only forensic trail Isabel
      # gets, since she can't reproduce this locally.
      - name: Browser tests (Playwright)
        id: e2e
        run: npm run test:e2e -- --reporter=html,list --trace=retain-on-failure

      - name: Upload Playwright report
        if: always() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
