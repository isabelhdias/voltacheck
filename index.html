<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16233D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cêntimo — máquinas de depósito, estado em tempo real</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#16233D;
    --ink-soft:#5A6786;
    --paper:#F2F4F1;
    --line:#DDE1DC;
    --azulejo:#2F6FB2;
    --ok:#1F9E63;
    --full:#D9932B;
    --down:#D64545;
    --stale:#8C93A5;
    --sheet-h:0px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html,body{
    height:100%;margin:0;
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    color:var(--ink);background:var(--paper);
    overscroll-behavior:none;
  }

  #map{position:absolute;inset:0;background:#E7EAE6}
  .leaflet-container{font-family:inherit}
  .leaflet-control-attribution{font-size:9px;background:rgba(242,244,241,.82)}

  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:600;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background:linear-gradient(180deg,var(--paper) 62%,rgba(242,244,241,0));
    pointer-events:none;
  }
  .brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.03em}
  .mode{
    pointer-events:auto;font-size:9.5px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;padding:2.5px 7px;border-radius:99px;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  }
  .mode[data-live="1"]{color:var(--ok);border-color:rgba(31,158,99,.35)}
  .filterbadge{
    pointer-events:auto;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;padding:2.5px 7px;border-radius:99px;
    border:1px solid var(--azulejo);background:#fff;color:var(--azulejo);cursor:pointer;
  }
  .filterbadge[hidden]{display:none}
  .chains{
    display:flex;gap:6px;margin-top:8px;pointer-events:auto;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .chains::-webkit-scrollbar{display:none}
  .chains button{
    flex:none;font:inherit;font-size:12px;font-weight:700;white-space:nowrap;
    padding:6px 12px;border-radius:99px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .chains button[aria-pressed="true"]{background:var(--azulejo);border-color:var(--azulejo);color:#fff}

  .tally{
    display:flex;gap:6px;margin-top:8px;pointer-events:auto;font-size:11px;font-weight:700;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tally::-webkit-scrollbar{display:none}

  /* Scroll affordance for .chains and .tally: a soft fade at whichever edge
     still has chips off-screen, so overflow is never silent. Pure CSS —
     mask-image driven by a scroll-linked animation, gated behind @supports
     so a browser that can't evaluate scroll position this way just shows
     the row unmasked (fully legible, no affordance) instead of a stuck or
     wrong one. The mask trims the row's own rendered pixels (chips
     included, not just its background) to transparent, so the last chip
     visibly dissolves into the paper the topbar already sits on — no new
     colour, no element that could catch a tap. */
  @supports (animation-timeline: scroll()) {
    @keyframes centimo-edge-fade{
      0%{
        mask-image:linear-gradient(to right,transparent 0,black 0,black calc(100% - 22px),transparent 100%);
        -webkit-mask-image:linear-gradient(to right,transparent 0,black 0,black calc(100% - 22px),transparent 100%);
      }
      4%,96%{
        mask-image:linear-gradient(to right,transparent 0,black 22px,black calc(100% - 22px),transparent 100%);
        -webkit-mask-image:linear-gradient(to right,transparent 0,black 22px,black calc(100% - 22px),transparent 100%);
      }
      100%{
        mask-image:linear-gradient(to right,transparent 0,black 22px,black 100%,transparent 100%);
        -webkit-mask-image:linear-gradient(to right,transparent 0,black 22px,black 100%,transparent 100%);
      }
    }
    .chains,.tally{
      animation-name:centimo-edge-fade;
      animation-timing-function:linear;
      animation-fill-mode:both;
      animation-timeline:scroll(self inline);
    }
  }
  .tally button{
    flex:none;display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:11px;font-weight:700;
    min-height:44px;background:#fff;border:1px solid var(--line);border-radius:99px;
    padding:4px 11px;color:var(--ink);cursor:pointer;white-space:nowrap;
  }
  .tally button[aria-pressed="false"]{opacity:.45}
  .tally i{width:7px;height:7px;border-radius:99px;font-style:normal}

  .search{position:relative;margin-top:8px;pointer-events:auto}
  .search input{
    width:100%;padding:9px 13px;font:inherit;font-size:14px;font-weight:500;
    border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--ink);
    -webkit-appearance:none;appearance:none;
  }
  .search input::placeholder{color:var(--ink-soft);font-weight:500}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none}
  .results{
    position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:650;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 6px 20px rgba(22,35,61,.16);
    max-height:46vh;overflow-y:auto;display:none;
  }
  .results.open{display:block}
  .results button{
    display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:10px;
    padding:10px 13px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);
    background:#fff;border:0;border-bottom:1px solid var(--line);
    cursor:pointer;text-align:left;
  }
  .results button:last-child{border-bottom:0}
  .results button:active{background:var(--paper)}
  .results b{font-weight:700}
  .results span{font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
  .results p{margin:0;padding:11px 13px;font-size:12.5px;font-weight:500;color:var(--ink-soft)}

  .pin{
    display:grid;place-items:center;width:26px;height:26px;border-radius:99px;
    border:2.5px solid #fff;box-shadow:0 2px 5px rgba(22,35,61,.32);
    font-size:13px;line-height:1;font-weight:800;color:#fff;
  }
  .pin[data-s="ok"]{background:var(--ok)}
  .pin[data-s="full"]{background:var(--full)}
  .pin[data-s="down"]{background:var(--down)}
  .pin[data-s="stale"]{background:var(--stale)}
  .pin.is-sel{transform:scale(1.28);z-index:9999}

  .fabs{
    position:absolute;right:12px;z-index:600;
    bottom:calc(var(--sheet-h) + env(safe-area-inset-bottom) + 16px);
    display:flex;flex-direction:column;gap:8px;transition:bottom .22s ease;
  }
  .fab{
    width:46px;height:46px;border-radius:14px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-size:19px;
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 3px 10px rgba(22,35,61,.14);
  }
  .fab.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .fab[disabled]{opacity:.5}

  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:700;
    background:#fff;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);
    box-shadow:0 -6px 26px rgba(22,35,61,.16);
    transform:translateY(102%);transition:transform .24s cubic-bezier(.3,.8,.4,1);
  }
  .sheet.open{transform:translateY(0)}
  .sheet .grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .sheet h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
  .meta{margin:5px 0 0;font-size:12px;color:var(--ink-soft);font-weight:500}
  .state{
    display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;
    margin-top:10px;padding:4px 9px;border-radius:99px;color:#fff;
  }
  .ask{
    margin:14px 0 0;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;color:var(--ink-soft);
  }
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .choice{
    border:1.5px solid var(--line);background:#fff;border-radius:13px;
    padding:11px 6px;font:inherit;font-weight:700;font-size:12.5px;color:var(--ink);
    cursor:pointer;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .choice u{width:11px;height:11px;border-radius:99px;text-decoration:none}
  .choice:active{transform:scale(.96)}
  .choice[disabled]{opacity:.5}

  .log{
    margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink-soft);font-weight:500;max-height:78px;overflow-y:auto;
  }
  .log p{margin:0 0 4px;display:flex;justify-content:space-between;gap:10px}
  .log em{font-style:normal;font-weight:700;color:var(--ink)}

  .empty{
    position:absolute;left:50%;top:50%;z-index:500;transform:translate(-50%,-50%);
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;box-shadow:0 6px 20px rgba(22,35,61,.16);
    text-align:center;max-width:80vw;
  }
  .empty[hidden]{display:none}
  .empty p{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-soft)}
  .empty button{
    font:inherit;font-weight:700;font-size:13px;padding:8px 16px;border-radius:99px;
    border:1.5px solid var(--azulejo);background:var(--azulejo);color:#fff;cursor:pointer;
  }

  .crosshair{
    position:absolute;left:50%;top:50%;z-index:650;
    transform:translate(-50%,-50%);pointer-events:none;display:none;
  }
  body.adding .crosshair{display:block}
  .crosshair div{
    width:34px;height:34px;border:3px solid var(--azulejo);
    border-radius:99px;background:rgba(47,111,178,.16);
  }
  .addbar{
    position:absolute;left:12px;right:12px;z-index:700;
    bottom:calc(env(safe-area-inset-bottom) + 16px);
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;
    box-shadow:0 -4px 20px rgba(22,35,61,.14);display:none;
  }
  body.adding .addbar{display:block}
  .addbar p{margin:0 0 9px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .addbar input, .addbar select{
    width:100%;padding:11px 12px;font:inherit;font-size:15px;font-weight:500;
    border:1.5px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);
  }
  .addbar input + input, .addbar input + select, .addbar select + input,
  .addbar datalist + input{margin-top:9px}
  .addbar .row{display:flex;gap:8px;margin-top:9px}
  .addbar button{
    flex:1;padding:11px;font:inherit;font-weight:700;font-size:14px;border-radius:11px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  .addbar button.go{background:var(--ink);color:#fff;border-color:var(--ink)}

  .toast{
    position:absolute;left:50%;z-index:900;
    bottom:calc(var(--sheet-h) + env(safe-area-inset-bottom) + 74px);
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;
    padding:9px 14px;border-radius:99px;max-width:86vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  :focus-visible{outline:2.5px solid var(--azulejo);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="map"></div>

<header class="topbar">
  <div class="brand">
    <h1>Cêntimo</h1>
    <span class="mode" id="mode">a ligar…</span>
    <button type="button" class="filterbadge" id="filterbadge" hidden>Filtros ativos · limpar</button>
  </div>
  <div class="search">
    <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Procurar por concelho" aria-label="Procurar máquinas por concelho">
    <div class="results" id="results"></div>
  </div>
  <div class="chains" id="chains"></div>
  <div class="tally" id="tally"></div>
</header>

<div class="empty" id="empty" hidden>
  <p>Nenhuma máquina com este filtro.</p>
  <button type="button" id="empty-clear">Limpar filtros</button>
</div>

<div class="crosshair"><div></div></div>

<div class="fabs">
  <button class="fab" id="locate" aria-label="Centrar na minha localização">◎</button>
  <button class="fab primary" id="add" aria-label="Adicionar máquina">+</button>
</div>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="grip"></div>
  <h2 id="s-name">—</h2>
  <p class="meta" id="s-addr"></p>
  <span class="state" id="s-state"></span>
  <p class="ask" id="s-ask">Estiveste lá agora?</p>
  <div class="choices">
    <button class="choice" data-s="ok"><u style="background:var(--ok)"></u>A funcionar</button>
    <button class="choice" data-s="full"><u style="background:var(--full)"></u>Cheia</button>
    <button class="choice" data-s="down"><u style="background:var(--down)"></u>Avariada</button>
  </div>
  <div class="log" id="s-log"></div>
</section>

<div class="addbar">
  <p>Arrasta o mapa até a máquina ficar dentro do círculo. (PREVIEW SMOKE TEST)</p>
  <input id="add-name" placeholder="Onde é? Ex.: Pingo Doce Areeiro" autocomplete="off" maxlength="80">
  <select id="add-chain" aria-label="Cadeia"></select>
  <input id="add-town" placeholder="Concelho — ex.: Pampilhosa da Serra" autocomplete="off" maxlength="60" list="towns">
  <datalist id="towns"></datalist>
  <input id="add-address" placeholder="Morada (opcional) — ex.: R. do Comércio 12" autocomplete="off" maxlength="120">
  <input id="add-note" placeholder="Nota (opcional) — ex.: ao lado da entrada" autocomplete="off" maxlength="140">
  <div class="row">
    <button id="add-cancel">Cancelar</button>
    <button class="go" id="add-save">Adicionar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="app/main.js"></script>
</body>
</html>
