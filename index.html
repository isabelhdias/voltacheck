<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16233D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cêntimo — máquinas de depósito, estado em tempo real</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#16233D;
    --ink-soft:#5A6786;
    --paper:#F2F4F1;
    --line:#DDE1DC;
    --azulejo:#2F6FB2;
    --ok:#1F9E63;
    --full:#D9932B;
    --down:#D64545;
    --stale:#8C93A5;
    --sheet-h:0px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html,body{
    height:100%;margin:0;
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    color:var(--ink);background:var(--paper);
    overscroll-behavior:none;
  }

  #map{position:absolute;inset:0;background:#E7EAE6}
  .leaflet-container{font-family:inherit}
  .leaflet-control-attribution{font-size:9px;background:rgba(242,244,241,.82)}

  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:600;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background:linear-gradient(180deg,var(--paper) 62%,rgba(242,244,241,0));
    pointer-events:none;
  }
  .brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.03em}
  .mode{
    pointer-events:auto;font-size:9.5px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;padding:2.5px 7px;border-radius:99px;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  }
  .mode[data-live="1"]{color:var(--ok);border-color:rgba(31,158,99,.35)}
  .tally{display:flex;gap:6px;margin-top:8px;pointer-events:auto;font-size:11px;font-weight:700}
  .tally b{
    display:inline-flex;align-items:center;gap:5px;
    background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 9px;
  }
  .tally i{width:7px;height:7px;border-radius:99px;font-style:normal}

  .search{position:relative;margin-top:8px;pointer-events:auto}
  .search input{
    width:100%;padding:9px 13px;font:inherit;font-size:14px;font-weight:500;
    border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--ink);
    -webkit-appearance:none;appearance:none;
  }
  .search input::placeholder{color:var(--ink-soft);font-weight:500}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none}
  .results{
    position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:650;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 6px 20px rgba(22,35,61,.16);
    max-height:46vh;overflow-y:auto;display:none;
  }
  .results.open{display:block}
  .results button{
    display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:10px;
    padding:10px 13px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);
    background:#fff;border:0;border-bottom:1px solid var(--line);
    cursor:pointer;text-align:left;
  }
  .results button:last-child{border-bottom:0}
  .results button:active{background:var(--paper)}
  .results b{font-weight:700}
  .results span{font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
  .results p{margin:0;padding:11px 13px;font-size:12.5px;font-weight:500;color:var(--ink-soft)}

  .pin{
    display:grid;place-items:center;width:26px;height:26px;border-radius:99px;
    border:2.5px solid #fff;box-shadow:0 2px 5px rgba(22,35,61,.32);
    font-size:13px;line-height:1;font-weight:800;color:#fff;
  }
  .pin[data-s="ok"]{background:var(--ok)}
  .pin[data-s="full"]{background:var(--full)}
  .pin[data-s="down"]{background:var(--down)}
  .pin[data-s="stale"]{background:var(--stale)}
  .pin.is-sel{transform:scale(1.28);z-index:9999}

  .fabs{
    position:absolute;right:12px;z-index:600;
    bottom:calc(var(--sheet-h) + env(safe-area-inset-bottom) + 16px);
    display:flex;flex-direction:column;gap:8px;transition:bottom .22s ease;
  }
  .fab{
    width:46px;height:46px;border-radius:14px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-size:19px;
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 3px 10px rgba(22,35,61,.14);
  }
  .fab.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .fab[disabled]{opacity:.5}

  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:700;
    background:#fff;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);
    box-shadow:0 -6px 26px rgba(22,35,61,.16);
    transform:translateY(102%);transition:transform .24s cubic-bezier(.3,.8,.4,1);
  }
  .sheet.open{transform:translateY(0)}
  .sheet .grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .sheet h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
  .meta{margin:5px 0 0;font-size:12px;color:var(--ink-soft);font-weight:500}
  .state{
    display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;
    margin-top:10px;padding:4px 9px;border-radius:99px;color:#fff;
  }
  .ask{
    margin:14px 0 0;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;color:var(--ink-soft);
  }
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .choice{
    border:1.5px solid var(--line);background:#fff;border-radius:13px;
    padding:11px 6px;font:inherit;font-weight:700;font-size:12.5px;color:var(--ink);
    cursor:pointer;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .choice u{width:11px;height:11px;border-radius:99px;text-decoration:none}
  .choice:active{transform:scale(.96)}
  .choice[disabled]{opacity:.5}

  .log{
    margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink-soft);font-weight:500;max-height:78px;overflow-y:auto;
  }
  .log p{margin:0 0 4px;display:flex;justify-content:space-between;gap:10px}
  .log em{font-style:normal;font-weight:700;color:var(--ink)}

  .crosshair{
    position:absolute;left:50%;top:50%;z-index:650;
    transform:translate(-50%,-50%);pointer-events:none;display:none;
  }
  body.adding .crosshair{display:block}
  .crosshair div{
    width:34px;height:34px;border:3px solid var(--azulejo);
    border-radius:99px;background:rgba(47,111,178,.16);
  }
  .addbar{
    position:absolute;left:12px;right:12px;z-index:700;
    bottom:calc(env(safe-area-inset-bottom) + 16px);
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;
    box-shadow:0 -4px 20px rgba(22,35,61,.14);display:none;
  }
  body.adding .addbar{display:block}
  .addbar p{margin:0 0 9px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .addbar input{
    width:100%;padding:11px 12px;font:inherit;font-size:15px;font-weight:500;
    border:1.5px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);
  }
  .addbar .row{display:flex;gap:8px;margin-top:9px}
  .addbar button{
    flex:1;padding:11px;font:inherit;font-weight:700;font-size:14px;border-radius:11px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  .addbar button.go{background:var(--ink);color:#fff;border-color:var(--ink)}

  .toast{
    position:absolute;left:50%;z-index:900;
    bottom:calc(var(--sheet-h) + env(safe-area-inset-bottom) + 74px);
    transform:translate(-50%,10px);
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;
    padding:9px 14px;border-radius:99px;max-width:86vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  :focus-visible{outline:2.5px solid var(--azulejo);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="map"></div>

<header class="topbar">
  <div class="brand">
    <h1>Cêntimo</h1>
    <span class="mode" id="mode">a ligar…</span>
  </div>
  <div class="search">
    <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Procurar por concelho" aria-label="Procurar máquinas por concelho">
    <div class="results" id="results"></div>
  </div>
  <div class="tally" id="tally"></div>
</header>

<div class="crosshair"><div></div></div>

<div class="fabs">
  <button class="fab" id="locate" aria-label="Centrar na minha localização">◎</button>
  <button class="fab primary" id="add" aria-label="Adicionar máquina">+</button>
</div>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="grip"></div>
  <h2 id="s-name">—</h2>
  <p class="meta" id="s-addr"></p>
  <span class="state" id="s-state"></span>
  <p class="ask" id="s-ask">Estiveste lá agora?</p>
  <div class="choices">
    <button class="choice" data-s="ok"><u style="background:var(--ok)"></u>A funcionar</button>
    <button class="choice" data-s="full"><u style="background:var(--full)"></u>Cheia</button>
    <button class="choice" data-s="down"><u style="background:var(--down)"></u>Avariada</button>
  </div>
  <div class="log" id="s-log"></div>
</section>

<div class="addbar">
  <p>Arrasta o mapa até a máquina ficar dentro do círculo.</p>
  <input id="add-name" placeholder="Onde é? Ex.: Pingo Doce Areeiro" autocomplete="off">
  <div class="row">
    <button id="add-cancel">Cancelar</button>
    <button class="go" id="add-save">Adicionar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

  ["Paradi Gafanha da Encarnação",40.62063,-8.732,"Ílhavo",13722147879],
  ["Paradi Gafanha da Nazaré I",40.64059,-8.71493,"Ílhavo",13722147882],
  ["Paradi Gafanha da Nazaré II",40.63597,-8.69554,"Ílhavo",13722147881],
  ["Paradi Praia da Barra",40.63814,-8.74623,"Ílhavo",13722147876],
  ["Pingo Doce Ílhavo",40.60359,-8.66169,"Ílhavo",13722146808],
  ["Continente Bom Dia Óbidos",39.35328,-9.15699,"Óbidos",13722147241],
  ["Intermarché Óbidos",39.38941,-9.12977,"Óbidos",13722147200],
  ["Pingo Doce Óbidos",39.3526,-9.1588,"Óbidos",13722146748]
  ];
  /* ── SEED END ── */

  var db = null, live = false;
  var machines = [], selected = null, markers = {};

  /* ───────── storage ───────── */

  /* Local mode keeps reports and any machine you added yourself, but always
     rebuilds the list from SEED. That way a refreshed import reaches people
     who already have the app open in a tab, instead of being masked forever
     by whatever was cached the first time. */

  function deviceId(){
    var v = null;
    try { v = localStorage.getItem(DID_KEY); } catch(e){ return null; }
    if(!v){
      if(window.crypto && crypto.randomUUID){
        v = crypto.randomUUID();
      } else if(window.crypto && crypto.getRandomValues){
        var a = new Uint8Array(16);
        crypto.getRandomValues(a);
        v = Array.prototype.map.call(a, function(b){ return (b + 256).toString(16).slice(1); }).join("");
      } else {
        v = String(Date.now()) + String(Math.random()).slice(2);
      }
      try { localStorage.setItem(DID_KEY, v); } catch(e){}
    }
    return v;
  }

  function localSeed(){
    return SEED.map(function(s){
      return { id:"osm-"+s[4], name:s[0], lat:s[1], lng:s[2], town:s[3], src:"osm", reports:[] };
    });
  }

  function localLoad(){
    var stored;
    try {
      stored = JSON.parse(localStorage.getItem(KEY) || "null");
    } catch(e){ stored = null; }
    if(!stored) return localSeed();

    var list = localSeed(), reports = stored.reports || {};
    list.forEach(function(m){ m.reports = reports[m.id] || []; });

    (stored.custom || []).forEach(function(c){
      list.push({
        id:c.id, name:c.name, lat:c.lat, lng:c.lng, town:c.town || "",
        src:"user", reports: reports[c.id] || []
      });
    });
    return list;
  }

  function localSave(){
    if(live) return;
    var reports = {}, custom = [];
    machines.forEach(function(m){
      if(m.reports && m.reports.length) reports[m.id] = m.reports;
      if(m.src === "user"){
        custom.push({ id:m.id, name:m.name, lat:m.lat, lng:m.lng, town:m.town || "" });
      }
    });
    try {
      localStorage.setItem(KEY, JSON.stringify({ reports:reports, custom:custom }));
    } catch(e){}
  }

  function goLocal(msg){
    live = false;
    var badge = document.getElementById("mode");
    badge.textContent = "modo local";
    badge.dataset.live = "0";
    badge.title = "Os reports ficam só neste dispositivo.";
    machines = localLoad();
    if(msg) toast(msg);
  }

  async function connect(){
    if(!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase){
      goLocal();
      return;
    }
    try {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      await pull();
      live = true;
      var badge = document.getElementById("mode");
      badge.textContent = "em direto";
      badge.dataset.live = "1";
      badge.title = "Reports partilhados com toda a gente.";
    } catch(err){
      goLocal("Sem ligação à base de dados — a mostrar dados locais");
    }
  }

  /* PostgREST caps how many rows one request returns (1000 on Supabase by
     default), and there are ~2.400 machines. Without paging, live mode would
     quietly show a fraction of the country and a town search would come up
     empty for the towns that fell off the end. */
  var PAGE = 1000;

  async function pageAll(build){
    var all = [], from = 0, res;
    for(;;){
      res = await build().range(from, from + PAGE - 1);
      if(res.error) throw res.error;
      all = all.concat(res.data);
      if(res.data.length < PAGE) return all;
      from += PAGE;
    }
  }

  async function pull(){
    var since = new Date(Date.now() - LOOKBACK_H * HOUR).toISOString();

    var mRows = await pageAll(function(){
      return db.from("machines")
               .select("id,name,lat,lng,town,source")
               .order("id", { ascending:true });
    });

    var rRows = await pageAll(function(){
      return db.from("reports")
               .select("machine_id,status,created_at")
               .gte("created_at", since)
               .order("created_at", { ascending:true });
    });

    var byId = {};
    mRows.forEach(function(x){
      byId[x.id] = { id:x.id, name:x.name, lat:x.lat, lng:x.lng,
                     town:x.town || "", src:x.source || "user", reports:[] };
    });
    rRows.forEach(function(x){
      if(byId[x.machine_id]){
        byId[x.machine_id].reports.push({ s:x.status, at:new Date(x.created_at).getTime() });
      }
    });

    machines = Object.keys(byId).map(function(k){ return byId[k]; });
  }

  var fix = null, FIX_TTL = 2 * 60 * 1000;

  function getFix(){
    return new Promise(function(resolve){
      if(fix && Date.now() - fix.at < FIX_TTL){ resolve(fix); return; }
      if(!navigator.geolocation){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        function(p){
          fix = { lat:p.coords.latitude, lng:p.coords.longitude,
                  acc:p.coords.accuracy, at:Date.now() };
          resolve(fix);
        },
        function(){ resolve(null); },
        { enableHighAccuracy:true, timeout:6000, maximumAge:60000 }
      );
    });
  }

  async function pushReport(machineId, status){
    if(!live) return "ok";                    // local mode: unchanged, and no geolocation prompt
    var f = await getFix();
    var res = await db.rpc("report_machine", {
      machine: machineId,
      state:   status,
      lat:     f ? f.lat : null,
      lng:     f ? f.lng : null,
      acc:     f ? f.acc : null,
      device:  deviceId()
    });
    if(res.error) return "erro";
    return res.data || "erro";
  }

  async function pushMachine(name, lat, lng){
    if(!live) return { id: "u-" + Date.now() };
    var res = await db.from("machines")
                      .insert({ name: name, lat: lat, lng: lng })
                      .select("id")
                      .single();
    return res.error ? null : res.data;
  }

  /* ───────── status logic ───────── */

  function latest(m){
    return (m.reports && m.reports.length) ? m.reports[m.reports.length - 1] : null;
  }
  function statusOf(m){
    var r = latest(m);
    if(!r) return "stale";
    return (Date.now() - r.at) > STALE_AFTER ? "stale" : r.s;
  }
  function ago(ts){
    var d = Date.now() - ts;
    if(d < HOUR)      return "há " + Math.max(1, Math.round(d / 60000)) + " min";
    if(d < 24 * HOUR) return "há " + Math.round(d / HOUR) + " h";
    return "há " + Math.round(d / (24 * HOUR)) + " d";
  }
  function find(id){
    return machines.filter(function(x){ return x.id === id; })[0];
  }

  /* ───────── map ───────── */

  var map = L.map("map", { zoomControl:false }).setView([38.7380, -9.1450], 13);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: 'Mapa e máquinas © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · estado reportado pela comunidade'
  }).addTo(map);

  function icon(m){
    var s = statusOf(m);
    return L.divIcon({
      className: "",
      html: '<div class="pin' + (selected === m.id ? " is-sel" : "") +
            '" data-s="' + s + '">' + GLYPH[s] + '</div>',
      iconSize:[26,26], iconAnchor:[13,13]
    });
  }

  /* With ~2.400 máquinas on the map, one marker each is more DOM than a phone
     can pan smoothly. Draw only what is on screen, and cap it — zoomed out to
     the whole country, a few thousand pins say nothing anyway. */

  var MAX_PINS = 400;

  function onScreen(){
    var b = map.getBounds().pad(0.2);
    var list = machines.filter(function(m){ return b.contains([m.lat, m.lng]); });
    if(list.length > MAX_PINS){
      var c = map.getCenter();
      list.sort(function(x, y){
        return ((x.lat-c.lat)*(x.lat-c.lat) + (x.lng-c.lng)*(x.lng-c.lng)) -
               ((y.lat-c.lat)*(y.lat-c.lat) + (y.lng-c.lng)*(y.lng-c.lng));
      });
      list = list.slice(0, MAX_PINS);
    }
    var sel = selected && find(selected);
    if(sel && list.indexOf(sel) === -1) list.push(sel);
    return list;
  }

  function draw(){
    var wanted = {};

    onScreen().forEach(function(m){
      wanted[m.id] = true;
      var key = statusOf(m) + (selected === m.id ? "!" : "");
      var mk = markers[m.id];
      if(mk){
        if(mk._k !== key){ mk.setIcon(icon(m)); mk._k = key; }
      } else {
        mk = L.marker([m.lat, m.lng], { icon: icon(m), keyboard:true })
              .addTo(map)
              .on("click", function(){ select(m.id); });
        mk._k = key;
        markers[m.id] = mk;
      }
    });

    Object.keys(markers).forEach(function(id){
      if(!wanted[id]){
        map.removeLayer(markers[id]);
        delete markers[id];
      }
    });

    tally();
  }

  function tally(){
    var c = { ok:0, full:0, down:0, stale:0 };
    machines.forEach(function(m){ c[statusOf(m)]++; });
    document.getElementById("tally").innerHTML =
      '<b><i style="background:' + COLOR.ok   + '"></i>' + c.ok   + ' a funcionar</b>' +
      '<b><i style="background:' + COLOR.full + '"></i>' + c.full + ' cheias</b>' +
      '<b><i style="background:' + COLOR.down + '"></i>' + c.down + ' avariadas</b>';
  }

  /* ───────── sheet ───────── */

  var sheet = document.getElementById("sheet");

  function sheetHeight(){
    document.documentElement.style.setProperty(
      "--sheet-h", sheet.classList.contains("open") ? sheet.offsetHeight + "px" : "0px"
    );
  }

  function select(id){
    selected = id;
    var m = find(id);
    if(!m) return;

    var s = statusOf(m), r = latest(m);

    document.getElementById("s-name").textContent = m.name;
    document.getElementById("s-addr").textContent =
      m.town || (m.lat.toFixed(4) + ", " + m.lng.toFixed(4));

    var st = document.getElementById("s-state");
    st.textContent = LABEL[s] + (r && s !== "stale" ? " · " + ago(r.at) : "");
    st.style.background = COLOR[s];

    document.getElementById("s-ask").textContent =
      (r && s !== "stale" && Date.now() - r.at > 3 * HOUR)
        ? "Ainda está assim?"
        : "Estiveste lá agora?";

    var log = document.getElementById("s-log");
    log.innerHTML = (!m.reports || !m.reports.length)
      ? "<p>Ainda ninguém reportou esta máquina.</p>"
      : m.reports.slice(-6).reverse().map(function(x){
          return "<p><em>" + LABEL[x.s] + "</em><span>" + ago(x.at) + "</span></p>";
        }).join("");

    sheet.classList.add("open");
    requestAnimationFrame(sheetHeight);
    draw();
    map.panTo([m.lat, m.lng], { animate:true });

    // Warm the location fix so tapping a choice doesn't wait the full 6 s —
    // but only if permission is already granted, so opening a sheet never
    // triggers the browser's location prompt on its own.
    if(live && navigator.permissions){
      navigator.permissions.query({ name:"geolocation" })
        .then(function(s){ if(s.state === "granted") getFix(); })
        .catch(function(){});
    }
  }

  function closeSheet(){
    selected = null;
    sheet.classList.remove("open");
    sheetHeight();
    draw();
  }

  map.on("click", closeSheet);
  map.on("moveend", draw);

  /* ───────── procura por concelho ───────── */

  var qInput = document.getElementById("q");
  var qResults = document.getElementById("results");

  /* "Braganca" has to find "Bragança", and "sao" has to find "São". Strip the
     accents off both sides rather than asking people to type them. */
  function norm(str){
    return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
  }

  /* Group the machines by concelho, keeping each one's bounds so picking a
     result can frame every machine in that town. */
  function townsMatching(term){
    var t = norm(term);
    if(!t) return [];

    var by = {};
    machines.forEach(function(m){
      if(!m.town) return;
      var g = by[m.town];
      if(!g){
        g = by[m.town] = { town:m.town, n:0, s:m.lat, n_:m.lat, w:m.lng, e:m.lng };
      }
      g.n++;
      if(m.lat < g.s)  g.s  = m.lat;
      if(m.lat > g.n_) g.n_ = m.lat;
      if(m.lng < g.w)  g.w  = m.lng;
      if(m.lng > g.e)  g.e  = m.lng;
    });

    var hits = [];
    Object.keys(by).forEach(function(k){
      var at = norm(k).indexOf(t);
      if(at >= 0) hits.push({ g:by[k], at:at });
    });

    /* Towns that start with what you typed come first. */
    hits.sort(function(a, b){
      if(a.at !== b.at) return a.at - b.at;
      return a.g.town.localeCompare(b.g.town, "pt");
    });

    return hits.slice(0, 8).map(function(h){ return h.g; });
  }

  function goToTown(g){
    closeSheet();
    qInput.value = g.town;
    qInput.blur();
    qResults.classList.remove("open");

    if(g.s === g.n_ && g.w === g.e){
      map.setView([g.s, g.w], 16);
    } else {
      /* Keep the framed machines clear of the topbar. */
      map.fitBounds([[g.s, g.w], [g.n_, g.e]], {
        paddingTopLeft:[28, 128], paddingBottomRight:[28, 44], maxZoom:15
      });
    }
  }

  function renderResults(){
    qResults.textContent = "";

    if(!qInput.value.trim()){
      qResults.classList.remove("open");
      return;
    }

    var list = townsMatching(qInput.value);

    if(!list.length){
      var none = document.createElement("p");
      none.textContent = "Nenhum concelho com esse nome.";
      qResults.appendChild(none);
    } else {
      list.forEach(function(g){
        var row = document.createElement("button");
        row.type = "button";

        var name = document.createElement("b");
        name.textContent = g.town;

        var count = document.createElement("span");
        count.textContent = g.n + (g.n === 1 ? " máquina" : " máquinas");

        row.appendChild(name);
        row.appendChild(count);
        row.addEventListener("click", function(){ goToTown(g); });
        qResults.appendChild(row);
      });
    }

    qResults.classList.add("open");
  }

  qInput.addEventListener("input", renderResults);
  qInput.addEventListener("focus", renderResults);

  qInput.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      qInput.value = "";
      qResults.classList.remove("open");
      qInput.blur();
    } else if(e.key === "Enter"){
      var list = townsMatching(qInput.value);
      if(list.length) goToTown(list[0]);
    }
  });

  document.addEventListener("click", function(e){
    if(!e.target || !e.target.closest || !e.target.closest(".search")){
      qResults.classList.remove("open");
    }
  });

  var choiceBtns = Array.prototype.slice.call(document.querySelectorAll(".choice"));

  choiceBtns.forEach(function(btn){
    btn.addEventListener("click", async function(){
      var m = find(selected);
      if(!m) return;

      choiceBtns.forEach(function(b){ b.disabled = true; });

      if(live) toast("A confirmar que estás junto à máquina…");
      var r = await pushReport(m.id, btn.dataset.s);

      if(r === "ok"){
        m.reports = (m.reports || []).concat([{ s: btn.dataset.s, at: Date.now() }]);
        localSave();
        select(m.id);
        toast(live ? "Obrigado — toda a gente vê isto agora" : "Guardado neste dispositivo");
      } else if(r === "cooldown"){
        toast("Já reportaste esta máquina há pouco. Volta daqui a uns minutos.");
      } else if(r === "far"){
        toast("Só dá para reportar quando estás junto à máquina.");
      } else if(r === "flood"){
        toast("Muitos reports deste telemóvel hoje. Tenta mais logo.");
      } else if(r === "unknown"){
        toast("Esta máquina já não existe. Recarrega a página.");
      } else {
        toast("Não consegui guardar. Tenta outra vez.");
      }

      choiceBtns.forEach(function(b){ b.disabled = false; });
    });
  });

  /* ───────── add machine ───────── */

  var nameInput = document.getElementById("add-name");
  var saveBtn   = document.getElementById("add-save");

  document.getElementById("add").addEventListener("click", function(){
    closeSheet();
    document.body.classList.add("adding");
    nameInput.value = "";
  });

  document.getElementById("add-cancel").addEventListener("click", function(){
    document.body.classList.remove("adding");
  });

  saveBtn.addEventListener("click", async function(){
    var name = nameInput.value.trim();
    if(name.length < 3){
      nameInput.focus();
      toast("Dá-lhe um nome para as pessoas a encontrarem");
      return;
    }

    var c = map.getCenter();
    saveBtn.disabled = true;

    var row = await pushMachine(name, c.lat, c.lng);

    if(row){
      machines.push({ id: row.id, name: name, lat: c.lat, lng: c.lng,
                      town: "", src: "user", reports: [] });
      localSave();
      document.body.classList.remove("adding");
      draw();
      toast("Máquina adicionada");
    } else {
      toast("Não consegui adicionar. Verifica a ligação.");
    }

    saveBtn.disabled = false;
  });

  /* ───────── locate ───────── */

  document.getElementById("locate").addEventListener("click", function(){
    if(!navigator.geolocation){ toast("Localização indisponível neste dispositivo"); return; }
    toast("A procurar-te…");
    navigator.geolocation.getCurrentPosition(
      function(p){ map.setView([p.coords.latitude, p.coords.longitude], 15); },
      function(){ toast("Não consegui obter a localização"); },
      { enableHighAccuracy:true, timeout:8000 }
    );
  });

  /* ───────── toast ───────── */

  var toastEl = document.getElementById("toast"), toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2400);
  }

  window.addEventListener("resize", sheetHeight);

  /* refresh when the app returns to the foreground */
  document.addEventListener("visibilitychange", async function(){
    if(document.visibilityState === "visible" && live){
      try { await pull(); draw(); if(selected) select(selected); } catch(e){}
    }
  });

  connect().then(draw);
})();
</script>
</body>
</html>
